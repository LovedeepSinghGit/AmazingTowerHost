
<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unity Web Player | Amazing Tower</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>

  <body>
    <div id="unity-container">
      <canvas
        id="unity-canvas"
        width="960"
        height="600"
        tabindex="-1">
      </canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>

        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>
    </div>

    <script>
      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display =
            warningBanner.children.length ? "block" : "none";
        }

        const div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type === "error") {
          div.style = "background: red; padding: 10px;";
        } else {
          if (type === "warning") {
            div.style = "background: yellow; padding: 10px;";
          }

          setTimeout(() => {
            if (div.parentNode === warningBanner) {
              warningBanner.removeChild(div);
              updateBannerVisibility();
            }
          }, 5000);
        }

        updateBannerVisibility();
      }

      async function retireLegacyServiceWorker() {
        if (!("serviceWorker" in navigator)) {
          return true;
        }

        const gameScope = new URL("./", window.location.href).href;

        const registrations =
          await navigator.serviceWorker.getRegistrations();

        const gameRegistrations = registrations.filter(
          registration => registration.scope === gameScope
        );

        const wasControlledByGameWorker =
          Boolean(navigator.serviceWorker.controller);

        await Promise.all(
          gameRegistrations.map(registration =>
            registration.unregister()
          )
        );

        // Remove only Amazing Tower's old caches.
        if ("caches" in window) {
          const cacheNames = await caches.keys();

          const oldGameCaches = cacheNames.filter(name =>
            name.startsWith("DefaultCompany-Amazing Tower")
          );

          await Promise.all(
            oldGameCaches.map(name => caches.delete(name))
          );
        }

        // Reload once if the current page was controlled
        // by the previous service worker.
        const reloadKey = "amazingTowerLegacyWorkerRetired";

        if (
          wasControlledByGameWorker &&
          !sessionStorage.getItem(reloadKey)
        ) {
          sessionStorage.setItem(reloadKey, "1");
          window.location.reload();
          return false;
        }

        sessionStorage.removeItem(reloadKey);

        return true;
      }

      async function startUnityGame() {
        try {
          const canStart = await retireLegacyServiceWorker();

          if (!canStart) return;

        } catch (error) {
          console.error(
            "Could not retire the old Amazing Tower service worker:",
            error
          );
        }

        const buildUrl = "Build";

        // CHANGE THIS VERSION WHENEVER YOU PUBLISH A NEW BUILD.
        const buildVersion = "build-05";

        const cacheBuster =
          "?v=" + encodeURIComponent(buildVersion);

        const loaderUrl =
          buildUrl + "/build-05.loader.js" + cacheBuster;

        const config = {
          arguments: [],

          dataUrl:
            buildUrl + "/build-05.data.unityweb" + cacheBuster,

          frameworkUrl:
            buildUrl + "/build-05.framework.js.unityweb" + cacheBuster,

          codeUrl:
            buildUrl + "/build-05.wasm.unityweb" + cacheBuster,

          streamingAssetsUrl: "StreamingAssets",

          companyName: "DefaultCompany",
          productName: "Amazing Tower",
          productVersion: "1.0",

          showBanner: unityShowBanner
        };

        // Mobile device configuration.
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          const meta = document.createElement("meta");

          meta.name = "viewport";

          meta.content =
            "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

          document.head.appendChild(meta);
        }

        loadingBar.style.display = "block";

        const script = document.createElement("script");

        script.src = loaderUrl;

        script.onload = () => {
          createUnityInstance(
            canvas,
            config,
            progress => {
              progressBarFull.style.width =
                (100 * progress) + "%";
            }
          )
          .then(() => {
            loadingBar.style.display = "none";
          })
          .catch(message => {
            console.error("Unity failed to start:", message);
            alert(message);
          });
        };

        script.onerror = () => {
          const message =
            "Could not load the Amazing Tower Unity loader. Please try again shortly.";

          console.error(message, loaderUrl);

          unityShowBanner(message, "error");
        };

        document.body.appendChild(script);
      }

      window.addEventListener("load", startUnityGame);
    </script>
  </body>
</html>
